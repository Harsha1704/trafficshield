events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream latency and request correlation ID
    log_format soc_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'req_id="$http_x_request_id"';

    access_log /var/log/nginx/access.log soc_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # Rate limiting zone (10 requests per second with burst 20)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream trafficshield_backend {
        server web:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost soc.trafficshield.internal;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Hardened Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';" always;

        location / {
            proxy_pass http://trafficshield_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Pass or generate X-Request-ID
            proxy_set_header X-Request-ID $http_x_request_id;

            # Apply rate limiting to mutations
            limit_req zone=api_limit burst=20 nodelay;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Health endpoint bypasses rate limiting for orchestrator probes
        location /api/v1/health {
            proxy_pass http://trafficshield_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
    }
}
